name: Uptime check

# External check for the VPS. Manual only while GitHub refuses to start jobs.
# Confirmed 13 Nov 2026: "The job was not started because your account is locked
# due to a billing issue." The run had zero steps, so no endpoint was checked.
#
# Adding billing details did not clear the latest recorded failure. Repeated
# scheduled runs only produce failure emails; retries and continue-on-error cannot
# fix an account lock that happens before the runner starts.
#
# Recovery: request a billing-lock review at https://support.github.com/ if payment
# information is already correct. After GitHub unlocks the account, run this manually
# and confirm all six endpoints pass BEFORE restoring cron "7,37 * * * *".
# "Enable workflow" alone does not restore a removed schedule.
#
# VPS-local health checks still run every 10 minutes, but cannot detect a whole-VPS
# outage. VPS Control keeps that coverage gap visible. deploy.yml ignores this file.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Public endpoints answer 200
        run: |
          fail=0
          for url in https://omnidl.softowetto.com/api/meta \
                     https://api-midi.softowetto.com/api/health \
                     https://api-docs.softowetto.com/api/health \
                     https://api-certs.softowetto.com/api/health \
                     https://import-midi.softowetto.com/health \
                     https://roamwise.softowetto.com/api/version; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 --retry 2 --retry-delay 15 "$url")
            echo "$code  $url"
            [ "$code" = "200" ] || { echo "::error::$url returned HTTP $code"; fail=1; }
          done
          exit $fail

