name: Uptime check

# On-demand external check for the VPS endpoints.
# Automatic triggers are paused: GitHub currently refuses to start jobs because of an
# account billing lock, so the old half-hourly schedule only generated failure emails.
# After resolving billing, run this from Actions > Uptime check > Run workflow.
# Restore scheduled monitoring explicitly if automatic outage alerts are wanted again.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Public endpoints answer 200
        run: |
          fail=0
          for url in https://omnidl.softowetto.com/api/meta \
                     https://api-midi.softowetto.com/api/health \
                     https://api-docs.softowetto.com/api/health \
                     https://api-certs.softowetto.com/api/health \
                     https://import-midi.softowetto.com/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 --retry 2 --retry-delay 15 "$url")
            echo "$code  $url"
            [ "$code" = "200" ] || { echo "::error::$url returned HTTP $code"; fail=1; }
          done
          exit $fail
